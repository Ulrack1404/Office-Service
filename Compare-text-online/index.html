<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="fav.png">  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение текстов онлайн</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: white;
            min-height: 100vh;
            padding: 0;
            color: #212529;
        }

        .app-card {
            max-width: 100%;
            width: 100%;
            background: white;
            padding: 0;
        }

        h1 {
            font-weight: 500;
            font-size: 28px;
            color: #212529;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        /* ===== КНОПКИ ===== */

          .btn {
            display: inline-block;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 400;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            padding: 8px 20px;
            font-size: 16px;
            line-height: 1.5;
            border-radius: 4px;
            border: 1px solid #ced4da;
            transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            user-select: none;
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn img {
            display: inline-block;
            height: 18px;
            width: 18px;
            flex-shrink: 0;
            vertical-align: middle;
        }

        .btn-primary {
            color: #fff;
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #0069d9;
            border-color: #0062cc;
        }

        .btn-primary:focus:not(:disabled) {
            outline: 0;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.5);
        }

        .btn-outline-secondary {
            color: #212529;
            background-color: transparent;
            border-color: #ced4da;
        }

        .btn-outline-secondary:hover:not(:disabled) {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 14px;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .text-box {
            background: #fff;
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 16px 18px 18px;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .text-box:focus-within {
            border-color: #80bdff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        .text-box label {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            font-size: 15px;
            color: #495057;
            margin-bottom: 10px;
        }

        .text-box label .left-label {
            color: #d0314e;
        }

        .text-box label .right-label {
            color: #2b8c5e;
        }

        .text-box label span {
            background: #e9ecef;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #495057;
            font-weight: 400;
        }

        .text-area {
            width: 100%;
            min-height: 120px;
            padding: 8px 12px;
            font-size: 15px;
            line-height: 1.6;
            font-family: 'SFMono-Regular', 'Menlo', 'Cascadia Code', 'Consolas', monospace;
            border: none;
            background: transparent;
            resize: vertical;
            outline: none;
            color: #212529;
        }

        .action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px 20px;
            margin: 8px 0 20px; 
        }

        .action-bar-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-compare_text {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 400;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            padding: 10px 24px;
            font-size: 16px;
            line-height: 1.5;
            border-radius: 4px;
            color: #fff;
            background-color: #007bff;
            border: 1px solid #007bff;
            transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            user-select: none;
            position: relative;
            min-width: 140px;
        }

        .btn-compare_text:hover:not(:disabled) {
            background-color: #0069d9;
            border-color: #0062cc;
        }

        .btn-compare_text:focus:not(:disabled) {
            outline: 0;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.5);
        }

        .btn-compare_text:active:not(:disabled) {
            background-color: #0062cc;
            border-color: #005cbf;
        }

        .btn-compare_text:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-compare_text .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-compare_text.loading .spinner {
            display: inline-block;
        }

        .btn-compare_text.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #495057;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #007bff;
            margin: 0;
            flex-shrink: 0;
        }

        .checkbox-wrapper input[type="checkbox"]:focus {
            outline: 2px solid #80bdff;
            outline-offset: 2px;
        }

        .stats {
            font-size: 15px;
            color: #495057;
            background: #e9ecef;
            padding: 6px 18px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .result-area {
            background: #fff;
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 20px 22px 18px;
            margin-top: 6px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .result-header h3 {
            font-weight: 500;
            font-size: 17px;
            color: #212529;
            letter-spacing: -0.2px;
        }

        .result-header .badge {
            background: #e9ecef;
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 13px;
            color: #495057;
        }

        .diff-container {
            background: #fff;
            padding: 0;
            min-height: 100px;
            font-family: 'SFMono-Regular', 'Menlo', 'Cascadia Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .diff-container .diff-line {
            display: block;
            padding: 2px 4px;
        }

        .diff-container .diff-line.highlight {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            border-left: 3px solid #ffb300;
            padding: 2px 4px;
            border-radius: 2px;
            margin: 1px 0;
        }

        .diff-container .diff-line.highlight-group {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            border-left: 3px solid #ffb300;
            padding: 2px 4px;
            margin: 1px 0;
            border-radius: 2px;
        }

        .diff-container .diff-left {
            background-color: #d0314e;
            color: white;
            padding: 0 2px;
            font-weight: 500;
            border-radius: 2px;
        }

        .diff-container .diff-right {
            background-color: #2b8c5e;
            color: white;
            padding: 0 2px;
            font-weight: 500;
            border-radius: 2px;
        }

        .diff-container .diff-equal {
            background: transparent;
            color: #212529;
        }

        .empty-hint {
            color: #6c757d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            font-weight: 400;
        }

        .progress-bar {
            display: none;
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-bar .progress-fill {
            height: 100%;
            background: #007bff;
            width: 0%;
            transition: width 0.3s;
        }

        @media (max-width: 760px) {
            body { padding: 12px; }
            .editor-grid { grid-template-columns: 1fr; gap: 16px; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .action-bar-left { flex-direction: column; align-items: stretch; }
            .btn-compare_text { width: 100%; justify-content: center; }
            .stats { text-align: center; white-space: normal; }
            .result-area { padding: 16px; }
            .checkbox-wrapper { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="app-card">
        <h1>Сравнение текстов</h1>

        <div class="editor-grid">
            <div class="text-box">
                <label>
                    <span class="left-label">Первый текст</span>
                    <span id="leftCount">0 симв.</span>
                </label>
                <textarea id="leftText" class="text-area"></textarea>
            </div>
            <div class="text-box">
                <label> 
                    <span class="right-label">Второй текст</span>
                    <span id="rightCount">0 симв.</span>
                </label>
                <textarea id="rightText" class="text-area"></textarea>
            </div>
        </div>

        <div class="action-bar">
            <div class="action-bar-left">
                <button id="compareBtn_text" class="btn btn-primary"> 
                    <span class="spinner"></span>
                    <span class="btn-text">Сравнить</span> 
                </button>
                <button class="btn btn-outline-secondary" id="clearBtn-text">
                    <img src="/img/clear.png" alt=""> Очистить
                </button>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="ignoreCase">
                    Игнорировать регистр
                </label>
            </div>
            <div class="stats" id="statsDisplay">Ожидание сравнения</div>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="result-area">
            <div class="result-header">
                <h3>Результат сравнения</h3>
                <span class="badge" id="diffBadge">различия выделены</span>
            </div>
            <div id="diffOutput" class="diff-container">
                <span class="empty-hint">Нажмите «Сравнить», чтобы увидеть отличия</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const leftText = document.getElementById('leftText');
            const rightText = document.getElementById('rightText');
            const leftCount = document.getElementById('leftCount');
            const rightCount = document.getElementById('rightCount');
            const compareBtn_text = document.getElementById('compareBtn_text');
            const clearBtn = document.getElementById('clearBtn-text');
            const diffOutput = document.getElementById('diffOutput');
            const statsDisplay = document.getElementById('statsDisplay');
            const diffBadge = document.getElementById('diffBadge');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const ignoreCaseCheckbox = document.getElementById('ignoreCase');

            let isProcessing = false;

            // Инициализация diff_match_patch
            const dmp = window.diff_match_patch ? new window.diff_match_patch() : new diff_match_patch();

            function updateCounters() {
                leftCount.textContent = leftText.value.length + ' симв.';
                rightCount.textContent = rightText.value.length + ' симв.';
            }

            leftText.addEventListener('input', updateCounters);
            rightText.addEventListener('input', updateCounters);

            // ---- ФУНКЦИЯ ОЧИСТКИ ----
            function clearAll() {
                leftText.value = '';
                rightText.value = '';
                updateCounters();
                diffOutput.innerHTML = '<span class="empty-hint">Нажмите «Сравнить», чтобы увидеть отличия</span>';
                statsDisplay.textContent = 'Ожидание сравнения';
                diffBadge.textContent = 'нет данных';
                progressBar.classList.remove('active');
                progressFill.style.width = '0%';
                compareBtn_text.disabled = false;
                compareBtn_text.classList.remove('loading');
                isProcessing = false;
            }

            // ---- СРАВНЕНИЕ С ИСПОЛЬЗОВАНИЕМ DIFF_MATCH_PATCH ----
            function computeDiff(left, right, ignoreCase) {
                let text1 = left;
                let text2 = right;
                
                if (ignoreCase) {
                    text1 = left.toLowerCase();
                    text2 = right.toLowerCase();
                }
                
                const diffs = dmp.diff_main(text1, text2);
                dmp.diff_cleanupSemantic(diffs);
                
                const result = [];
                let pos1 = 0;
                let pos2 = 0;
                
                for (const diff of diffs) {
                    const op = diff[0];
                    const text = diff[1];
                    const len = text.length;
                    
                    if (op === 0) {
                        const originalText = left.substring(pos1, pos1 + len);
                        result.push({ type: 'equal', line: originalText });
                        pos1 += len;
                        pos2 += len;
                    } else if (op === -1) {
                        const originalText = left.substring(pos1, pos1 + len);
                        result.push({ type: 'left', line: originalText });
                        pos1 += len;
                    } else if (op === 1) {
                        const originalText = right.substring(pos2, pos2 + len);
                        result.push({ type: 'right', line: originalText });
                        pos2 += len;
                    }
                }
                
                return result;
            }

            // ---- ФОРМАТИРОВАНИЕ РЕЗУЛЬТАТА ----
            function formatDiff(diffSegments) {
                if (!diffSegments || diffSegments.length === 0) {
                    return { html: '<span class="empty-hint">Тексты пусты</span>', leftCount: 0, rightCount: 0 };
                }

                let leftOnly = 0;
                let rightOnly = 0;
                const lines = [];
                
                function escapeHtml(str) {
                    return str.replace(/&/g, '&amp;')
                              .replace(/</g, '&lt;')
                              .replace(/>/g, '&gt;')
                              .replace(/"/g, '&quot;')
                              .replace(/'/g, '&#039;');
                }

                let currentLine = '';
                let currentHasDiff = false;
                
                function flushLine() {
                    if (currentLine !== '' || lines.length === 0) {
                        lines.push({ content: currentLine, hasDiff: currentHasDiff });
                        if (currentHasDiff) {
                            leftOnly++;
                        }
                    }
                    currentLine = '';
                    currentHasDiff = false;
                }

                for (const seg of diffSegments) {
                    const text = seg.line;
                    const isDiff = (seg.type === 'left' || seg.type === 'right');
                    
                    const parts = text.split('\n');
                    
                    for (let i = 0; i < parts.length; i++) {
                        const part = parts[i];
                        const isLast = (i === parts.length - 1);
                        
                        if (part === '' && isLast && text.endsWith('\n')) {
                            if (currentLine !== '' || currentHasDiff) {
                                flushLine();
                            }
                            lines.push({ content: '', hasDiff: false });
                            continue;
                        }
                        
                        if (isDiff) {
                            const escaped = escapeHtml(part);
                            const wrapped = seg.type === 'left' ? 
                                `<span class="diff-left">${escaped}</span>` : 
                                `<span class="diff-right">${escaped}</span>`;
                            currentLine += wrapped;
                            currentHasDiff = true;
                        } else {
                            currentLine += escapeHtml(part);
                        }
                        
                        if (!isLast || text.endsWith('\n')) {
                            flushLine();
                        }
                    }
                }
                
                if (currentLine !== '' || currentHasDiff) {
                    flushLine();
                }

                let leftCount = 0;
                let rightCount = 0;
                for (const line of lines) {
                    if (line.hasDiff) {
                        if (line.content.includes('diff-left')) leftCount++;
                        if (line.content.includes('diff-right')) rightCount++;
                    }
                }

                const lineCountTotal = lines.length;
                const shouldHighlight = lineCountTotal > 10;
                let html = '';
                
                if (!shouldHighlight) {
                    for (const line of lines) {
                        if (line.hasDiff) {
                            html += `<div class="diff-line highlight">${line.content}</div>`;
                        } else {
                            html += `<div class="diff-line">${line.content}</div>`;
                        }
                    }
                } else {
                    let i = 0;
                    while (i < lines.length) {
                        if (!lines[i].hasDiff) {
                            html += `<div class="diff-line">${lines[i].content}</div>`;
                            i++;
                            continue;
                        }
                        
                        let start = i;
                        while (i < lines.length && lines[i].hasDiff) {
                            i++;
                        }
                        let end = i - 1;
                        const groupLength = end - start + 1;
                        
                        if (groupLength === 1) {
                            html += `<div class="diff-line highlight">${lines[start].content}</div>`;
                        } else {
                            for (let j = start; j <= end; j++) {
                                html += `<div class="diff-line highlight-group">${lines[j].content}</div>`;
                            }
                        }
                    }
                }

                return { html, leftCount, rightCount };
            }

            // ---- ОСНОВНАЯ ФУНКЦИЯ СРАВНЕНИЯ ----
            function performCompare() {
                if (isProcessing) return;
                
                const leftVal = leftText.value;
                const rightVal = rightText.value;
                const ignoreCase = ignoreCaseCheckbox.checked;

                if (leftVal === '' && rightVal === '') {
                    diffOutput.innerHTML = '<span class="empty-hint">Введите текст в оба поля</span>';
                    statsDisplay.textContent = 'Оба поля пусты';
                    diffBadge.textContent = 'нет данных';
                    return;
                }

                isProcessing = true;
                compareBtn_text.disabled = true;
                compareBtn_text.classList.add('loading');
                progressBar.classList.add('active');
                progressFill.style.width = '0%';
                diffOutput.innerHTML = '<span class="empty-hint">Выполняется сравнение...</span>';

                setTimeout(() => {
                    try {
                        progressFill.style.width = '30%';
                        
                        const diffSegments = computeDiff(leftVal, rightVal, ignoreCase);
                        
                        progressFill.style.width = '70%';
                        
                        const { html, leftCount, rightCount } = formatDiff(diffSegments);
                        
                        progressFill.style.width = '100%';
                        
                        diffOutput.innerHTML = html || '<span class="empty-hint">Тексты полностью совпадают</span>';

                        const totalDiff = leftCount + rightCount;
                        if (totalDiff === 0) {
                            statsDisplay.textContent = 'Тексты идентичны';
                            diffBadge.textContent = 'совпадают';
                        } else {
                            statsDisplay.textContent = `Различий: ${leftCount} слева, ${rightCount} справа (всего ${totalDiff})`;
                            diffBadge.textContent = `${totalDiff} отличий`;
                        }

                        if (leftVal === '' && rightVal !== '') {
                            statsDisplay.textContent = `Только правый текст (${rightCount})`;
                        } else if (rightVal === '' && leftVal !== '') {
                            statsDisplay.textContent = `Только левый текст (${leftCount})`;
                        }
                    } catch (e) {
                        console.error(e);
                        diffOutput.innerHTML = `<span class="empty-hint">Ошибка: ${e.message}</span>`;
                        statsDisplay.textContent = 'Ошибка сравнения';
                    } finally {
                        isProcessing = false;
                        compareBtn_text.disabled = false;
                        compareBtn_text.classList.remove('loading');
                        setTimeout(() => {
                            progressBar.classList.remove('active');
                            progressFill.style.width = '0%';
                        }, 500);
                    }
                }, 100);
            }

            // ---- ОБРАБОТЧИКИ ----
            compareBtn_text.addEventListener('click', performCompare);
            clearBtn.addEventListener('click', clearAll);

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active === leftText || active === rightText) {
                        e.preventDefault();
                        performCompare();
                    }
                }
            });

            ignoreCaseCheckbox.addEventListener('change', function() {
                if (leftText.value !== '' && rightText.value !== '') {
                    performCompare();
                }
            });

            // ---- ИНИЦИАЛИЗАЦИЯ ----
            leftText.value = '';
            rightText.value = '';
            updateCounters();
            
            diffOutput.innerHTML = '<span class="empty-hint">Нажмите «Сравнить», чтобы увидеть отличия</span>';
            statsDisplay.textContent = 'Ожидание сравнения';
            diffBadge.textContent = 'нет данных';
        })();
    </script>
</body>
</html>
